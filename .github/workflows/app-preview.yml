name: App Store app preview

# Records the app preview video (integration_test/preview_test.dart) on an
# iPhone 6.9" simulator, adds captions (tool/make_preview.py) and commits
# appstore/previews/ja/iphone69/preview.mp4 to the same branch.
# A new recording is never byte-identical, so this runs only when the
# preview itself changes or by hand (not on every app change).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'integration_test/preview_test.dart'
      - 'tool/make_preview.py'
      - '.github/workflows/app-preview.yml'

permissions:
  contents: write

concurrency:
  group: app-preview-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  record:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
      - run: flutter pub get

      - name: Record
        run: |
          set -euo pipefail
          mkdir -p build/preview
          udid=$(python3 tool/pick_simulator.py "Pro Max")
          for try in 1 2 3; do
            xcrun simctl shutdown all || true
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b > /dev/null
            # Build first so the recording does not hold minutes of build time.
            flutter build ios --simulator --debug --dart-define-from-file=config/app_config.json > build/preview/build.log 2>&1
            rm -f build/preview/raw.mp4
            xcrun simctl io "$udid" recordVideo --codec=h264 --force build/preview/raw.mp4 2> build/preview/recorder.log &
            rec=$!
            for i in $(seq 1 50); do grep -q "Recording started" build/preview/recorder.log && break; sleep 0.2; done
            python3 -c 'import time; print(int(time.time() * 1000))' > build/preview/start_ms
            if perl -e 'alarm shift; exec @ARGV' 900 \
                 flutter drive \
                   --driver=test_driver/integration_test.dart \
                   --target=integration_test/preview_test.dart \
                   --dart-define-from-file=config/app_config.json \
                   -d "$udid" > build/preview/drive.log 2>&1; then
              kill -INT "$rec"; wait "$rec" || true
              grep -q "PREVIEW [0-9]* done" build/preview/drive.log && break
            else
              kill -INT "$rec"; wait "$rec" || true
            fi
            echo "::warning::recording failed (try $try)"
            tail -n 40 build/preview/drive.log || true
            [ "$try" = 3 ] && { echo "::error::recording failed 3 times"; exit 1; }
          done
          grep "PREVIEW" build/preview/drive.log
          ls -l build/preview/raw.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: preview-raw
          path: build/preview
          retention-days: 7

  compose:
    needs: record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: preview-raw
          path: build/preview
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Compose
        run: |
          python3 tool/make_preview.py build/preview/raw.mp4 "$(cat build/preview/start_ms)" \
            build/preview/drive.log appstore/previews/ja/iphone69/preview.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size \
            -of compact appstore/previews/ja/iphone69/preview.mp4
          mkdir -p build/frames
          for t in 1 6 14 20 25; do
            ffmpeg -loglevel error -y -ss "$t" -i appstore/previews/ja/iphone69/preview.mp4 -frames:v 1 -vf scale=443:-1 "build/frames/$t.png" || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: app-preview
          path: |
            appstore/previews
            build/frames
          retention-days: 14
      - name: Commit preview
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git add appstore/previews
          if git diff --cached --quiet; then echo "Preview unchanged."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update App Store app preview"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
