name: App Store screenshots

# Takes the App Store screenshots on iPhone 6.9" and iPad 13" simulators
# (integration_test/screenshots_test.dart) and commits them to
# appstore/screenshots/ on the same branch when they changed.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'integration_test/**'
      - 'test_driver/**'
      - 'tool/pick_simulator.py'
      - '.github/workflows/screenshots.yml'

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    # Fork PRs cannot push back; skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7

      - run: flutter pub get

      # First boot of a simulator can take minutes (data migration); boot both
      # up front so the app launch does not race it.
      - name: Boot simulators
        run: |
          set -euo pipefail
          IPHONE=$(python3 tool/pick_simulator.py "Pro Max")
          IPAD=$(python3 tool/pick_simulator.py "iPad Pro 13-inch")
          echo "IPHONE=$IPHONE" >> "$GITHUB_ENV"
          echo "IPAD=$IPAD" >> "$GITHUB_ENV"
          xcrun simctl boot "$IPHONE" || true
          xcrun simctl boot "$IPAD" || true
          xcrun simctl bootstatus "$IPHONE" -b > /dev/null
          xcrun simctl bootstatus "$IPAD" -b > /dev/null

      - name: Take screenshots
        run: |
          set -euo pipefail
          drive() {
            # A stuck simulator launch must not burn the whole job: 20 min per try.
            SCREENSHOT_DIR="$2" perl -e 'alarm shift; exec @ARGV' 1200 \
              flutter drive \
                --driver=test_driver/integration_test.dart \
                --target=integration_test/screenshots_test.dart \
                --dart-define-from-file=config/app_config.json \
                -d "$1"
          }
          shoot() {
            local udid="$1" out="$2" w="$3" h="$4"
            rm -rf "$out"
            if ! drive "$udid" "$out"; then
              echo "::warning::flutter drive failed on $udid; restarting the simulator and retrying once"
              xcrun simctl shutdown "$udid" || true
              xcrun simctl boot "$udid"
              xcrun simctl bootstatus "$udid" -b > /dev/null
              rm -rf "$out"
              drive "$udid" "$out"
            fi
            # App Store accepts only exact sizes; fail loudly if the device changed.
            for f in "$out"/*.png; do
              size=$(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/{print $2}' | paste -sd x -)
              echo "$f: $size"
              [ "$size" = "${w}x${h}" ] || { echo "::error::$f is $size, expected ${w}x${h}"; exit 1; }
            done
          }
          shoot "$IPHONE" appstore/screenshots/ja/iphone69 1320 2868
          shoot "$IPAD" appstore/screenshots/ja/ipad13 2064 2752

      - uses: actions/upload-artifact@v4
        with:
          name: appstore-screenshots
          path: appstore/screenshots
          retention-days: 14

      - name: Commit screenshots
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git add appstore/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update App Store screenshots"
          # The branch may have moved while the simulators ran.
          # The build changes lockfiles etc.; only the screenshots are committed.
          git pull --rebase --autostash origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
